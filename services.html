<!DOCTYPE html>
<html class="index-html" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service Items | SS Tex</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="media/SST Logo.png" />
  </head>
  <body>
    <header class="index-header">
      <img class="sstex-logo" src="media/SST Logo.png" alt="SS Tex" />
      <h1>Service Items</h1>
    </header>
    <p id="pageStatus" class="app-status" role="status">Signing in…</p>
    <main class="entry-content" data-private hidden>
      <nav class="app-nav" aria-label="Invoice app">
        <div class="app-tabs"></div>
        <button id="signOut" type="button">Sign out</button>
      </nav>

      <section class="catalog-grid" aria-label="Service catalog">
        <form id="serviceForm">
          <label>Service description <textarea name="description" maxlength="500" rows="2" required></textarea></label>
          <label>Unit price (₹) <input name="rate" type="number" min="0" max="999999999.99" step="0.01" required /></label>
          <label>HSN/SAC code <input name="hsn" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" value="9987" required /></label>
          <label>GST % <input name="gstPercent" type="number" min="0" max="100" step="0.01" value="18" required /></label>
          <button type="submit">Save service</button>
          <button type="button" data-cancel hidden>Cancel edit</button>
          <p class="app-status" data-form-status role="status" hidden></p>
        </form>
        <div>
          <h2>Saved services</h2>
          <p class="app-status" data-list-status role="status">Loading services…</p>
          <ul class="entry-list" data-records></ul>
        </div>
      </section>
    </main>
    <script type="module" src="app-tabs.js"></script>
    <script type="module" src="catalog.js"></script>
  </body>
</html>
