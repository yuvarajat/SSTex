<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="workspace.css" />
    <link rel="icon" href="media/SST Logo.png" />
    <title>Sign in | SS Tex Invoice</title>
  </head>
  <body class="workspace login-page">
    <main class="login-card">
      <img class="login-photo" src="media/login-background.jpeg" alt="" />
      <div class="login-content">
        <div class="brand">
          <img src="media/SST Logo.png" alt="" width="44" height="44" />
          <span>SS Tex</span>
        </div>
        <h1>Sign in</h1>
        <form class="login-form field-stack">
          <label class="field">Email
            <input type="email" id="email" autocomplete="username" required />
          </label>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-control">
              <input type="password" id="password" autocomplete="current-password" required />
              <button id="passwordVisibility" class="password-toggle" type="button" aria-controls="password" aria-label="Show password" title="Show password" hidden>
                <span class="password-eye" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <button type="submit" class="button button-primary" disabled>Sign in</button>
          <p id="loginStatus" class="app-status is-loading" role="status">Loading sign-in…</p>
        </form>
      </div>
    </main>
    <footer class="app-footer"></footer>
    <script type="module" src="app-footer.js"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
