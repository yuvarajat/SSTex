<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="workspace.css" />
    <link rel="icon" href="media/SST Logo.png" />
    <title>Sign in | SS Tex Invoice</title>
  </head>
  <body class="workspace login-page">
    <main class="login-card">
      <img class="login-photo" src="media/login-background.jpeg" alt="" />
      <div class="login-content">
        <div class="brand">
          <img src="media/SST Logo.png" alt="" width="44" height="44" />
          <span>SS Tex</span>
        </div>
        <h1>Sign in</h1>
        <form class="login-form field-stack">
          <label class="field">Email
            <input type="email" id="email" autocomplete="username" required />
          </label>
          <label class="field">Password
            <input type="password" id="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="button button-primary" disabled>Sign in</button>
          <p id="loginStatus" class="app-status is-loading" role="status">Connecting to Firebase…</p>
        </form>
      </div>
    </main>
    <footer class="app-footer"></footer>
    <script type="module" src="app-footer.js"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
