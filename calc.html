<!DOCTYPE html>
<html class="index-html" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SS Tex's Tax Invoice Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="media/SST Logo.png" type="image/x-icon" />
  </head>
  <body>
    <header class="index-header">
      <img class="sstex-logo" src="media/SST Logo.png" alt="logo" />
      <h1 class="ta-center">
        SS Tex's <br />
        Invoice Generator
      </h1>
    </header>
    <p id="pageStatus" class="app-status" role="status">Signing in…</p>
    <main class="entry-content" data-private hidden>
      <nav class="app-nav" aria-label="Invoice app">
        <a href="history.html">Invoice History</a>
        <a href="catalog.html">Customers &amp; Services</a>
        <button id="signOut" type="button">Sign out</button>
      </nav>
      <p id="catalogStatus" class="app-status" role="status" hidden></p>

      <form id="form">
        <h3>BILL TO:</h3>
        <div class="customer-fields">
          <label for="customerPicker">Saved customer</label>
          <select id="customerPicker" disabled><option value="">Enter details manually</option></select>
          <label for="millName">Mill Name</label>
          <input id="millName" name="customerName" type="text" maxlength="160" required />
          <label for="millAddress">Mill Address</label>
          <textarea id="millAddress" name="customerAddress" maxlength="500" rows="3" required></textarea>
          <label for="millGSTIN">GSTIN</label>
          <input id="millGSTIN" name="gstin" type="text" maxlength="15" pattern="[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]" required />
          <label for="placeOfSupply">Place of Supply</label>
          <input id="placeOfSupply" type="text" readonly />
          <label for="invoiceNo">Invoice No.</label>
          <div class="number-field">
            <input id="invoiceNo" type="text" maxlength="40" required />
            <span id="yearSuffix"></span>
          </div>
          <label for="invoiceDate">Invoice Date</label>
          <input id="invoiceDate" type="date" min="2000-01-01" max="9999-12-31" required />
        </div>

        <div class="table-scroll" tabindex="0" role="region" aria-label="Invoice line items">
          <table class="entry-items">
            <thead>
              <tr>
                <th scope="col">S.No.</th>
                <th scope="col">Particulars</th>
                <th scope="col">HSN/SAC<br />Code</th>
                <th scope="col">Rate<br />(Rs.)</th>
                <th scope="col">Quantity</th>
                <th scope="col">GST %</th>
                <th scope="col">Amount<br />(Rs.)</th>
              </tr>
            </thead>
            <tbody id="lineItems"></tbody>
          </table>
        </div>

        <div class="totals">
          <label>Total <input id="total" readonly /></label>
          <label>IGST <input id="igst" readonly /></label>
          <label>CGST <input id="cgst" readonly /></label>
          <label>SGST <input id="sgst" readonly /></label>
          <label>Total Amount <input id="totalAmount" readonly /></label>
        </div>
        <label class="tax-switch"><input id="myCheckbox" type="checkbox" /> Apply IGST</label>
        <label class="amount-in-words">Amount (in words) <input id="amountInWords" readonly /></label>
        <p id="formStatus" class="app-status" role="status" hidden></p>
        <button type="reset">RESET</button>
        <button type="submit">SUBMIT</button>
      </form>
    </main>
    <template id="lineTemplate">
      <tr>
        <th scope="row" data-serial></th>
        <td>
          <select data-field="service" aria-label="Saved service" disabled><option value="">Enter service manually</option></select>
          <textarea data-field="description" aria-label="Particulars" maxlength="500" rows="2"></textarea>
        </td>
        <td data-label="HSN/SAC"><input data-field="hsn" aria-label="HSN/SAC code" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" value="9987" /></td>
        <td data-label="Rate (Rs.)"><input data-field="rate" aria-label="Rate" type="number" min="0" max="999999999.99" step="0.01" /></td>
        <td data-label="Quantity"><input data-field="quantity" aria-label="Quantity" type="number" min="0.001" max="999999.999" step="0.001" /></td>
        <td data-label="GST %"><input data-field="gstPercent" aria-label="GST percentage" type="number" min="0" max="100" step="0.01" value="18" /></td>
        <td data-label="Amount (Rs.)"><input data-field="amount" aria-label="Amount" readonly /></td>
      </tr>
    </template>
    <br /><br /><br /><br />
    <h3 class="ta-center">
      © 2026 - SS Tex. All Rights Reserved. <br /><br />
      Built with HTML, CSS & JavaScript. <br /><br />
      Developed by
      <a href="https://www.linkedin.com/in/yuvarajat/">Yuvaraja Tamilvanan</a>
    </h3>
    <script type="module" src="index-script.js"></script>
  </body>
</html>
