<!DOCTYPE html>
<html class="index-html" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Details | SS Tex</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="media/SST Logo.png" />
  </head>
  <body>
    <header class="index-header">
      <img class="sstex-logo" src="media/SST Logo.png" alt="SS Tex" />
      <h1>Customer Details</h1>
    </header>
    <p id="pageStatus" class="app-status" role="status">Signing in…</p>
    <main class="entry-content" data-private hidden>
      <nav class="app-nav" aria-label="Invoice app">
        <div class="app-tabs"></div>
        <button id="signOut" type="button">Sign out</button>
      </nav>

      <section class="catalog-grid" aria-label="Customer catalog">
        <form id="customerForm">
          <label>Customer name <input name="customerName" maxlength="160" required /></label>
          <label>Billing address <textarea name="customerAddress" maxlength="500" rows="3" required></textarea></label>
          <label>GSTIN <input name="gstin" maxlength="15" pattern="[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]" required /></label>
          <button type="submit">Save customer</button>
          <button type="button" data-cancel hidden>Cancel edit</button>
          <p class="app-status" data-form-status role="status" hidden></p>
        </form>
        <div>
          <h2>Saved customers</h2>
          <p class="app-status" data-list-status role="status">Loading customers…</p>
          <ul class="entry-list" data-records></ul>
        </div>
      </section>
    </main>
    <script type="module" src="app-tabs.js"></script>
    <script type="module" src="catalog.js"></script>
  </body>
</html>
