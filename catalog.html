<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Details | SS Tex</title>
    <link rel="stylesheet" href="workspace.css" />
    <link rel="icon" href="media/SST Logo.png" />
  </head>
  <body class="workspace">
    <nav class="app-nav" aria-label="Invoice app"></nav>
    <div class="workspace-content">
      <header class="page-heading"><h1>Customer Details</h1></header>
      <p id="pageStatus" class="app-status is-loading" role="status">Signing in…</p>
      <main data-private hidden>
        <section class="catalog-grid" aria-label="Customer catalog">
          <form id="customerForm" class="panel">
            <h2>Billing details</h2>
            <div class="field-stack">
              <label class="field">Customer name <input name="customerName" maxlength="160" required /></label>
              <label class="field">Billing address <textarea name="customerAddress" maxlength="500" rows="3" required></textarea></label>
              <label class="field">GSTIN <input name="gstin" spellcheck="false" autocapitalize="characters" maxlength="15" pattern="[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]" required /></label>
              <div class="catalog-actions">
                <button type="submit" class="button button-primary">Save customer</button>
                <button type="button" class="button button-secondary" data-cancel hidden>Cancel edit</button>
              </div>
              <p class="app-status" data-form-status role="status" hidden></p>
            </div>
          </form>
          <div class="panel list-panel">
            <h2>Saved customers</h2>
            <p class="app-status is-loading" data-list-status role="status">Loading customers…</p>
            <ul class="entry-list" data-records></ul>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="app-tabs.js"></script>
    <script type="module" src="catalog.js"></script>
  </body>
</html>
