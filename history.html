<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice History | SS Tex</title>
    <link rel="stylesheet" href="workspace.css" />
    <link rel="icon" href="media/SST Logo.png" />
  </head>
  <body class="workspace">
    <nav class="app-nav" aria-label="Invoice app"></nav>
    <div class="workspace-content">
      <header class="page-heading"><h1>Invoice History</h1></header>
      <p id="pageStatus" class="app-status is-loading" role="status">Signing in…</p>
      <main data-private hidden>
        <section id="draftSection" class="panel pending-panel" hidden>
          <h2>Drafts</h2>
          <p id="draftsStatus" class="is-loading" role="status">Loading drafts…</p>
          <ul id="draftList" class="entry-list"></ul>
        </section>
        <section id="pendingSection" class="panel pending-panel" hidden>
          <h2>Pending on this device</h2>
          <p>Open a pending invoice to retry saving it.</p>
          <ul id="pendingList" class="entry-list"></ul>
        </section>
        <section class="panel history-panel" aria-label="Saved invoices">
          <p id="historyStatus" class="list-status is-loading" role="status">Loading saved invoices…</p>
          <div id="invoiceTable" class="table-scroll" tabindex="0" role="region" aria-label="Invoice table" hidden>
            <table class="history-table">
              <thead><tr>
                <th scope="col">Invoice no.</th>
                <th scope="col">Date</th>
                <th scope="col">Customer</th>
                <th scope="col">Total</th>
              </tr></thead>
              <tbody id="invoiceList"></tbody>
            </table>
          </div>
        </section>
        <p id="legacyInvoice" hidden><a href="bill.html">View the last invoice from this browser</a></p>
      </main>
    </div>
    <footer class="app-footer"></footer>
    <script type="module" src="app-footer.js"></script>
    <script type="module" src="app-tabs.js"></script>
    <script type="module" src="history.js"></script>
  </body>
</html>
